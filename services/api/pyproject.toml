[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "car-live-monitor-api"
version = "0.1.0"
description = "Realtime API for the internal car live monitoring pilot"
requires-python = ">=3.11"
dependencies = [
  "aliyun-python-sdk-core>=2.16,<3",
  "cryptography>=46,<47",
  "fastapi>=0.115,<1",
  "imageio-ffmpeg>=0.6,<1",
  "markitdown[pdf,docx,pptx]>=0.1.7,<0.2",
  "openpyxl>=3.1,<4",
  "pydantic-settings>=2.7,<3",
  "pypdf>=5.1,<7",
  "python-docx>=1.1,<2",
  "python-multipart>=0.0.20,<1",
  "python-pptx>=1.0,<2",
  "rank-bm25>=0.2.2,<0.3",
  "streamlink>=8.5,<9",
  "uvicorn[standard]>=0.34,<1",
  "websockets>=14,<17"
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<1",
  "pytest>=8.3,<9",
  "ruff>=0.9,<1"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
