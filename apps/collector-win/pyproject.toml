[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "car-live-monitor-collector"
version = "0.1.0"
description = "Windows system audio collector for the internal live monitor"
requires-python = ">=3.11"
dependencies = [
  "numpy>=2.1,<3",
  "soundcard>=0.4.4,<1",
  "websocket-client>=1.8,<2"
]

[project.scripts]
car-live-collector = "collector.app:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["collector*"]

